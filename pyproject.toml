[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zscan"
version = "0.4.0"
description = "Prototype static malware scanner: YARA rules plus file heuristics"
requires-python = ">=3.10"
dependencies = ["yara-python>=4.3", "pefile>=2023.2.7"]

[project.optional-dependencies]
test = ["pytest"]
ml = ["numpy>=1.26", "lightgbm>=4.0"]

[project.scripts]
zscan = "zscan.cli:main"

[tool.setuptools.packages.find]
include = ["zscan*"]

[tool.setuptools.package-data]
zscan = ["rules/*.yar"]
